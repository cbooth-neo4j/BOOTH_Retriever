[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "booth-retriever"
version = "0.0.1"
description = "BOOTH: a self-improving Neo4j retriever for neo4j-graphrag-python, with a similarity cache over approved queries and a curation workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "BOOTH Team" }]
keywords = ["neo4j", "graphrag", "retrieval", "cypher", "rag", "text2cypher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "neo4j>=5.14",
    "neo4j-graphrag>=1.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Optional agentic Text2Cypher backend
agent = [
    "deepagents>=0.1.0",
]

# FastAPI layer over BOOTHCurator / BOOTHRetriever. Opt-in so the base
# package stays dependency-light for users who only consume the Python API.
# The [openai] sub-extra of neo4j-graphrag is pulled in so that the /api/ask
# endpoint has a working embedder out of the box.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "neo4j-graphrag[openai]>=1.0",
]

# Everything a developer needs
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-cov>=5",
    "testcontainers[neo4j]>=4",
    "ruff>=0.5",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.scripts]
booth = "booth_retriever.cli:app"

[project.urls]
Homepage = "https://github.com/BOOTHRetriever/booth-retriever"
Issues = "https://github.com/BOOTHRetriever/booth-retriever/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/booth_retriever"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "smoke: Tier-1 smoke tests (import + CLI entrypoint, < 1s)",
    "unit: Tier-2 unit tests with mocked Neo4j and LLM",
    "integration: Tier-3 tests requiring a real Neo4j via testcontainers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter
