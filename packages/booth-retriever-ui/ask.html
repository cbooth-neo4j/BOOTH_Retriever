<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask BOOTH</title>

    <!--
      Brand CSS bundle, same order as index.html:
        1. palettes.css  — raw --neo4j-{palette}-{shade} values
        2. fonts.css     — @font-face for Public Sans + SyneNeo
        3. theme-dark.css — semantic tokens
        4. styles.css    — app-specific styles
    -->
    <link rel="stylesheet" href="/brand/css/palettes.css" />
    <link rel="stylesheet" href="/brand/css/fonts.css" />
    <link rel="stylesheet" href="/brand/css/theme-dark.css" />
    <link rel="stylesheet" href="/src/styles.css" />

    <link
      rel="preload"
      href="/brand/typography/fonts/PublicSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/brand/typography/fonts/SyneNeo-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/logos/logo-mark-fullcolor-rgb-transparent.svg"
    />
  </head>
  <body class="page-ask">
    <header class="app-header">
      <div class="app-brand">
        <img
          class="brand-logo"
          src="/brand/logos/logo-white-rgb-transparent.svg"
          alt="Neo4j"
          height="28"
        />
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="app-title">Ask BOOTH</span>
      </div>
      <nav class="app-nav" aria-label="Primary">
        <a href="/ask.html" class="nav-link" aria-current="page">Ask</a>
        <a href="/index.html" class="nav-link">Curate</a>
      </nav>
    </header>

    <main class="ask-layout">
      <section class="ask-card" aria-label="Ask BOOTH a question">
        <h2>Your Question</h2>

        <form id="ask-form" class="ask-form">
          <textarea
            id="ask-input"
            class="ask-input"
            rows="4"
            spellcheck="true"
            placeholder="How many users are in the system?"
            required
          ></textarea>

          <div class="ask-examples" aria-label="Example questions">
            <span class="ask-examples-label">Try one of these:</span>
            <button
              type="button"
              class="example-chip"
              data-example="What legal and compliance requirements must the potential banking partner meet?"
            >
              Legal &amp; compliance requirements
            </button>
            <button
              type="button"
              class="example-chip"
              data-example="Which RFPs require banking partners to compete on pricing and rebates, and what are the evaluation criteria?"
              data-high-risk="true"
            >
              Pricing &amp; rebate evaluation criteria
              <span class="example-chip-tag">high-risk</span>
            </button>
            <button
              type="button"
              class="example-chip"
              data-example="Reconcile the APAC custody payment break with UUID 7c2f9a84-3b6e-4f1a-9b2d-2f5e8c1a4d77 from the transaction lifecycle management system."
            >
              Reconcile APAC payment break
              <span class="example-chip-tag">process</span>
            </button>
          </div>

          <label class="checkbox-row">
            <input id="ask-risk" type="checkbox" />
            <span>High-risk</span>
          </label>

          <div class="actions">
            <button id="ask-submit" type="submit" class="primary">Ask</button>
          </div>
        </form>
      </section>

      <section id="answer-card" class="answer-card hidden" aria-live="polite">
        <!-- Populated by renderAnswer() in src/render.ts -->
      </section>
    </main>

    <!--
      Graph popup: right-side slide-over (~1/3 width) showing the Neo4j NVL
      visualisation of the graph used for the answer. Toggled by src/graph.ts.
    -->
    <aside id="graph-panel" class="graph-panel hidden" aria-hidden="true" aria-label="Answer graph">
      <header class="graph-panel-header">
        <h2>Answer graph</h2>
        <button id="graph-close" type="button" class="secondary" aria-label="Close graph">Close</button>
      </header>
      <div id="graph-frame" class="graph-frame"></div>
      <p id="graph-empty" class="graph-empty muted hidden">
        No graph elements were associated with this answer.
      </p>
    </aside>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="/src/ask.ts"></script>
  </body>
</html>
